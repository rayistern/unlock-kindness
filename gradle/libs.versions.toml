[versions]
# NOTE (2026-07-01, GH issue #1): This version catalog does not exist in the
# Google AI Studio export — AI Studio's cloud build supplies it and it was
# never committed. Every version below is a best-effort reconstruction based
# on what's compatible with compileSdk 36 / JDK 21 / Kotlin 2.x as of mid-2026.
# If CI fails on a dependency-resolution or version-conflict error, this file
# is the first place to look. See the issue for the "known risks" note.
