# Project-wide Gradle settings. Missing from the Google AI Studio export (GH issue #1).
#
# JVM args for the Gradle daemon. -Xmx2048m keeps CI runners (typically 7GB RAM)
# comfortable while still giving KSP/Room annotation processing enough headroom.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX package structure (required — this project's code already
# imports androidx.* throughout).
android.useAndroidX=true

# Kotlin code style: "official" matches the IntelliJ/Android Studio default
# formatter and avoids reformat churn between contributors' IDE configs.
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself, speeding up incremental
# builds — the modern default recommended by AGP.
android.nonTransitiveRClass=true
