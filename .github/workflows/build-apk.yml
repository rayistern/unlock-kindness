name: Build debug APK

# GH issue #1 (2026-07-01): make this repo buildable end-to-end in CI so every
# push produces a downloadable debug APK, removing the dependency on
# re-opening the project in Google AI Studio.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.7.x / Gradle 8.11.x require JDK 17+; using 21 (Temurin) per the
      # issue spec and to match what Android Studio bundles today.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches the Gradle wrapper distribution + dependency downloads across
      # runs, keyed on the wrapper properties and every build.gradle*/toml
      # file so a dependency bump invalidates the cache automatically.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The debug build type's signingConfig (app/build.gradle.kts) points at
      # ${rootDir}/debug.keystore, which is gitignored and never committed
      # (every Android checkout is expected to have its own). Generate the
      # standard well-known debug keystore (alias "androiddebugkey", both
      # passwords "android" — matching the config in app/build.gradle.kts)
      # so assembleDebug has something to sign with. This is the same
      # keystore Android Studio auto-generates on first run; it is not a
      # secret and is safe to recreate deterministically on every CI run.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # GEMINI_API_KEY: written to .env only if the repo secret is set. If the
      # secret is absent (e.g. before the user configures it, or on a fork's
      # PR where secrets aren't exposed), the Secrets Gradle Plugin falls
      # back to the placeholder in .env.example and the build still
      # compiles — see app/src/main/java/com/example/data/GeminiConfig.kt for
      # the runtime-side guard that fires only if Gemini-calling code is
      # exercised without a real key configured.
      - name: Write .env
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
